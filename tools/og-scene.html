<!doctype html>
<!-- סצנת תמונת השיתוף (1200×630). tools/og.mjs מגיש אותה יחד עם dist ומצלם. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1d4596; }
  .scene {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 45%, #1d4596 55%, #16377a);
  }
  .scene::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgb(0 0 0 / .14) 0 1px, transparent 1px 3px); pointer-events: none; }
  canvas { position: absolute; inset: 0; }
  .name {
    position: absolute; left: 0; right: 0; top: 300px; text-align: center;
    font: 400 var(--size) / 1 'Rubik Pixels', monospace; color: #fff; letter-spacing: .01em; white-space: nowrap;
    text-shadow: 0 0 24px rgb(180 207 255 / .35);
  }
</style>
</head>
<body>
<div class="scene">
  <canvas id="c" width="1200" height="630"></canvas>
  <div class="name" id="name"></div>
</div>
<script type="module">
  import { SPRITES, ROWS, bake } from '/assets/game.js';
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') || 'he';
  const nameEl = document.getElementById('name');
  nameEl.textContent = lang === 'he' ? 'צמח חדד' : 'Tsemach Hadad';
  nameEl.style.setProperty('--size', lang === 'he' ? '200px' : '124px');
  if (lang === 'he') nameEl.dir = 'rtl';

  let s = 7;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  await document.fonts.load('200px "Rubik Pixels"');

  const W = 1200, H = 630, cell = 5;
  const g = document.getElementById('c').getContext('2d');
  g.imageSmoothingEnabled = false;

  // כוכבים
  for (let i = 0; i < 110; i++) {
    g.globalAlpha = .35 + rnd() * .55;
    g.fillStyle = ['#ffffff', '#b4cfff', '#ffb547', '#ff7a8a'][(rnd() * 4) | 0];
    g.fillRect(rnd() * W, rnd() * H, 2, 2);
  }
  g.globalAlpha = 1;

  const art = ROWS.map(r => bake(r.kind === 'boss' ? SPRITES.boss : SPRITES.bug2, r.a, r.b, cell));
  const gapX = 74, cols = 8, x0 = (W - (cols - 1) * gapX) / 2;
  const rowsY = [52, 108, 160];
  const layout = [
    { row: 0, cols: [2, 5] },
    { row: 1, cols: [1, 2, 3, 4, 5, 6] },
    { row: 2, cols: [0, 1, 2, 3, 4, 5, 6, 7] },
  ];
  // חייזרים שכבר נפגעו (חורים במערך) ואחד שמתפוצץ עכשיו
  const gone = new Set(['1:3', '2:1', '2:6', '0:5']);
  const boom = { row: 2, col: 4 };
  const pos = (row, col, a) => ({ x: x0 + col * gapX - a.width / 2, y: rowsY[row] });

  for (const { row, cols: cs } of layout) {
    for (const col of cs) {
      const key = row + ':' + col;
      if (gone.has(key) || (row === boom.row && col === boom.col)) continue;
      const a = art[row]; const p = pos(row, col, a);
      g.drawImage(a, Math.round(p.x), Math.round(p.y));
    }
  }

  // צולל בסגנון Galaxian
  g.drawImage(art[1], 905, 228);

  // הפיצוץ: ניצוצות + פיקסלים שעפים לכיוון השם
  const b = pos(boom.row, boom.col, art[2]);
  const cx = b.x + art[2].width / 2, cy = b.y + art[2].height / 2;
  for (let i = 0; i < 26; i++) {
    const ang = rnd() * Math.PI * 2, r = 6 + rnd() * 34;
    g.fillStyle = i % 3 ? '#b4cfff' : '#ffffff';
    g.globalAlpha = .55 + rnd() * .45;
    g.fillRect(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, cell, cell);
  }
  g.globalAlpha = 1;
  const nr = nameEl.getBoundingClientRect();
  for (let i = 0; i < 46; i++) {
    const t = rnd();
    const tx = nr.left + rnd() * nr.width, ty = nr.top + 20 + rnd() * (nr.height - 40);
    const x = cx + (tx - cx) * t + (1 - t) * t * (rnd() - .5) * 220, y = cy + (ty - cy) * t;
    g.globalAlpha = .35 + t * .65;
    g.fillStyle = t > .55 ? '#ffffff' : '#b4cfff';
    g.fillRect(Math.round(x), Math.round(y), 6, 6);
  }
  g.globalAlpha = 1;

  // הספינה ויריות
  const ship = bake(SPRITES.ship, '#ffffff', '#ffb547', 6);
  const sx = 640 - ship.width / 2, sy = 548;
  g.drawImage(ship, sx, sy);
  g.fillStyle = '#ffe08a';
  for (const y of [500, 440, 380]) g.fillRect(637, y, cell, cell * 3);

  document.body.dataset.ready = '1';
</script>
</body>
</html>
